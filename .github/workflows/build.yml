name: Build Mush8 IPA

on:
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Rust for iOS
        run: |
          # Use pre-installed rustup to add the iOS target
          rustup target add aarch64-apple-ios

      - name: Compile Mush8 Binary
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Unsigned-IPA
          path: build/Mush8.ipa
