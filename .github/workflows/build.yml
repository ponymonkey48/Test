name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Rust for iOS
        run: |
          rustup target add aarch64-apple-ios

      - name: Create Mock Keys File
        run: |
          # Creates an empty mock file to satisfy the repository's path check
          touch prod.keys

      - name: Compile Mush8 Binary
        run: |
          chmod +x ./make-ios.sh
          # Skips asset packaging using the empty key file
          ./make-ios.sh --ipa --no-assets

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Unsigned-IPA
          path: build/Mush8.ipa
