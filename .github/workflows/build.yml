name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Rust for iOS
        run: |
          rustup target add aarch64-apple-ios

      - name: Direct Cargo Compilation
        run: |
          # Build the native backend structures directly via Cargo
          cargo build --release --target aarch64-apple-ios

      - name: Package App Bundle Layout
        run: |
          # Assemble the physical iOS Payload directory
          mkdir -p Payload/Mush8.app
          cp target/aarch64-apple-ios/release/nxhost Payload/Mush8.app/Mush8
          
          # Setup an infrastructure Info.plist profile
          cat > Payload/Mush8.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Mush8</string>
              <key>CFBundleIdentifier</key>
              <string>com.c22dev.mush8</string>
              <key>CFBundleName</key>
              <string>Mush8</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          # Zip everything into a clean IPA structure
          zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Unsigned-IPA
          path: Mush8.ipa
