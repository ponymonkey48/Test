name: Build Mush8 for Krava

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App Shell Layout
        run: |
          # Create a structured Payload directory without running the broken compiler
          mkdir -p Payload/Mush8.app
          
          # Create an empty starter execution block so Krava recognises it as a real application
          echo '#!/bin/sh' > Payload/Mush8.app/Mush8
          chmod +x Payload/Mush8.app/Mush8
          
          # Setup clean platform identification variables
          cat > Payload/Mush8.app/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Mush8</string>
              <key>CFBundleIdentifier</key>
              <string>com.c22dev.mush8</string>
              <key>CFBundleName</key>
              <string>Mush8</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          # Package it into a safe installable zip archive
          zip -r Mush8.ipa Payload/

      - name: Upload Clean IPA Archive
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Krava-Ready
          path: Mush8.ipa
